<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RC Acronym Challenge - Host</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f1a;color:#fff;min-height:100vh}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 40px}
.container{max-width:960px;width:100%;margin:0 auto}
h1{color:#EC0002;font-size:36px;font-weight:900}
.sub{color:#666;font-size:15px;margin-top:4px}
.btn{border:none;border-radius:12px;padding:16px 32px;font-size:18px;font-weight:700;cursor:pointer;color:#fff;text-align:center;margin:8px;transition:opacity 0.2s}
.btn:hover{opacity:0.9}
.btn-red{background:#EC0002}
.btn-orange{background:#f39c12}
.btn-grey{background:#555}
.card{background:#1a1a2e;border-radius:24px;padding:48px 64px;border:2px solid rgba(236,0,2,0.2);text-align:center}
.code{font-size:88px;font-weight:900;letter-spacing:20px;color:#fff}
.label{color:#666;font-size:12px;text-transform:uppercase;letter-spacing:3px;margin-bottom:12px}
.players-wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0 32px}
.ptag{background:#1a1a2e;border-radius:12px;padding:14px 28px;font-size:18px;font-weight:700}
.timer-ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;background:#1a1a2e;transition:all 0.3s}
.timer-warn{background:#e74c3c;animation:pulse 0.5s ease-in-out infinite}
.pbar{background:#222;border-radius:4px;height:6px;overflow:hidden;width:100%;margin-bottom:36px}
.pfill{height:100%;border-radius:4px;transition:width 1s linear;background:#EC0002}
.acronym{font-size:80px;font-weight:900;color:#EC0002;letter-spacing:6px}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border-radius:14px;padding:22px 28px;display:flex;align-items:center;gap:18px;color:#fff}
.opt-lbl{font-size:28px;font-weight:900;opacity:0.6;min-width:32px}
.opt-txt{font-size:17px;font-weight:600;line-height:1.3}
.vbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.vtrack{flex:1;background:#1a1a2e;border-radius:10px;overflow:hidden;height:44px;position:relative}
.vfill{height:100%;transition:width 0.8s ease-out}
.vlbl{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;color:#ddd}
.vcnt{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:800}
.lbrow{display:flex;align-items:center;gap:16px;background:#1a1a2e;border-radius:14px;padding:18px 28px;margin-bottom:10px}
.lbbar{width:180px;background:#333;border-radius:8px;height:26px;overflow:hidden;margin-right:12px}
.lbfill{background:#EC0002;height:100%;border-radius:8px;transition:width 0.8s ease-out}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:24px;margin-bottom:56px;height:300px}
.pcol{display:flex;flex-direction:column;align-items:center}
.pblock{width:170px;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900}
.correct-box{display:inline-block;background:rgba(46,204,113,0.13);border:2px solid #2ecc71;border-radius:12px;padding:12px 32px;margin-top:16px}
.correct-txt{font-size:22px;font-weight:700;color:#2ecc71}
.status{text-align:center;color:#555;font-size:15px;margin-top:24px}
.qr-box{background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center}
.qr-box img{width:200px;height:200px;border-radius:8px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
</style>
</head>
<body>
