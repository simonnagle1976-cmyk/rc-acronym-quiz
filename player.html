<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RC Quiz - Join</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;min-height:100vh;background:#f2f2f5}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.join-form{background:#fff;border-radius:24px;padding:32px;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.08)}
h2{font-size:26px;font-weight:800;text-align:center;margin-bottom:28px;color:#EC0002}
.input{width:100%;padding:16px;font-size:18px;border-radius:12px;border:2px solid #e0e0e0;outline:none;margin-bottom:14px;font-family:inherit}
.input:focus{border-color:#EC0002}
.input-code{font-size:28px;text-align:center;letter-spacing:12px;font-weight:800}
.btn{width:100%;border:none;border-radius:12px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit}
.btn-red{background:#EC0002}
.btn:active{opacity:0.85;transform:scale(0.98)}
.error{color:#e74c3c;font-size:14px;text-align:center;margin-bottom:12px}
.info{color:#999;font-size:14px;text-align:center;margin-bottom:12px}
.spinner{width:44px;height:44px;border:4px solid #EC0002;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:24px auto 0}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding:8px 0}
.answer-btn{border:none;border-radius:16px;padding:14px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100px;font-family:inherit;transition:transform 0.1s}
.answer-btn:active{transform:scale(0.95)}
.albl{font-size:26px;font-weight:900;margin-bottom:4px;opacity:0.6}
.atxt{font-size:13px;line-height:1.3}
.score-box{background:rgba(255,255,255,0.07);border-radius:16px;padding:20px 40px;display:inline-block}
.lock-circle{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;margin:0 auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="app" class="screen"></div>
<script>
firebase.initializeApp({
  databaseURL: "https://rc-jeopardy-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "rc-jeopardy"
});
var db = firebase.database();
var rootRef = db.ref("acronym-quiz");
var stateRef = rootRef.child("state");
var playersRef = rootRef.child("players");
var scoresRef = rootRef.child("scores");

var LB = ["A","B","C","D","E","F"];
var CO = ["#e74c3c","#3498db","#2ecc71","#f39c12","#9b59b6","#1abc9c"];
var TM = 20;
var QS = [
  {a:"SOL",q:"What does SOL stand for?",o:["Strategic Outcomes Lifecycle","Scope Optimise Launch","Sniffing Obsessed Labradors","Start of Life","Stage Onboarding Launch","Spaniels Only Lounge"],c:3},
  {a:"OGSM",q:"What does OGSM stand for?",o:["Old Grey Snouts Mischief","Omnichannel Growth Social Media","Our Golden Shepherd's Mess","Outcomes Gains Schemes Metrics","Objective, Goals, Strategies, Measures","Operational Growth Strategy Management"],c:4},
  {a:"BHN",q:"What does BHN stand for?",o:["Barking Howling Napping","Balanced Hybrid Nutrients","Breed Health Nutrition","Brand Halo Narrative","Big Hungry Newfoundlands","Bespoke Holistic Nourishment"],c:2},
  {a:"CCN",q:"What does CCN stand for?",o:["Cats Control Nights","Core Category Nutrients","Companion Clinical Nourishment","Campaign Creative Network","Chihuahuas Chasing Naps","Canine Care Nutrition"],c:5},
  {a:"FHN",q:"What does FHN stand for?",o:["Full-Funnel Hype Network","Feline Health Nutrition","Fluffy Hair Nightmare","Functional Health Nutrients","Furball Hoover Needed","Felis Holistic Nourishment"],c:1},
  {a:"VCM",q:"What does VCM stand for?",o:["Value Conversion Model","Very Cuddly Mammals","Video Content Machine","Vacuum Cat's Moulting","Veterinary Commercial Marketing","Veterinary Category Management"],c:5},
  {a:"SPT",q:"What does SPT stand for?",o:["Squeaky Paws Toys","Strategic Portfolio Tracking","Search Performance Team","Specialist Pet Trade","Strategic Priority Taskforce","Sniff Patrol Troop"],c:3},
  {a:"NPD",q:"What does NPD stand for?",o:["Nutritional Portfolio Design","Novel Package Design","New Product Development","Naughty Puppy Department","Nose Print Database","New Pitch Deck"],c:2},
  {a:"CAGR",q:"What does CAGR stand for?",o:["Category Adjusted Growth Revenue","Canines Acquire Gourmet Rewards","Cumulative Average Gain Ratio","Client Acquisition Growth Report","Cats Always Get Revenge","Compound Annual Growth Rate"],c:5}
];

var app = document.getElementById("app");
var pid = Math.random().toString(36).slice(2, 10);
var pName = "";
var pCode = "";
var phase = "join";
var myAns = null;
var wasCorrect = null;
var myScore = 0;
var lastQ = -1;
var gameState = null;

// Read ?rc= from QR code URL
var urlRC = new URLSearchParams(window.location.search).get("rc") || "";

function renderJoin() {
  app.className = "screen";
  app.style.background = "#f2f2f5";
  app.innerHTML =
    '<div class="join-form">' +
      '<h2>&#127919; Join Game</h2>' +
      '<input class="input" id="name-input" placeholder="Your name">' +
      '<input class="input input-code" id="code-input" placeholder="Code" maxlength="4" value="' + urlRC + '">' +
      '<div id="err-msg"></div>' +
      '<button class="btn btn-red" id="join-btn">Join &#8594;</button>' +
    '</div>';
  document.getElementById("join-btn").onclick = doJoin;
  if (urlRC) document.getElementById("name-input").focus();
}

function doJoin() {
  pName = document.getElementById("name-input").value.trim();
  pCode = document.getElementById("code-input").value.trim();
  var errEl = document.getElementById("err-msg");
  if (!pName || !pCode) { errEl.innerHTML = '<p class="error">Enter name and code</p>'; return; }
  errEl.innerHTML = '<p class="info">Connecting...</p>';
  stateRef.once("value").then(function(snap) {
    var state = snap.val();
    if (!state) { errEl.innerHTML = '<p class="error">No game found. Is the host running?</p>'; return; }
    if (state.rc !== pCode) { errEl.innerHTML = '<p class="error">Wrong code. Check the host screen.</p>'; return; }
    playersRef.child(pid).set({name: pName, ans: null, fq: -1, at: 0});
    gameState = state;
    phase = "lobby";
    renderLobby();
    startListening();
  });
}

function startListening() {
  stateRef.on("value", function(snap) {
    var state = snap.val();
    if (!state) return;
    gameState = state;
    if (state.phase === "question") {
      if (state.cq !== lastQ) {
        lastQ = state.cq;
        myAns = null;
        wasCorrect = null;
        phase = "question";
        renderQuestion();
      }
    } else if (state.phase === "reveal") {
      if (myAns !== null) wasCorrect = myAns === QS[state.cq].c;
      phase = "reveal";
      scoresRef.child(pid).once("value").then(function(s) { myScore = s.val() || 0; renderReveal(); });
    } else if (state.phase === "leaderboard") {
      phase = "leaderboard";
      scoresRef.child(pid).once("value").then(function(s) { myScore = s.val() || 0; renderLeaderboard(); });
    } else if (state.phase === "final") {
      phase = "final";
      scoresRef.child(pid).once("value").then(function(s) { myScore = s.val() || 0; renderFinal(); });
    } else if (state.phase === "lobby") {
      phase = "lobby";
      renderLobby();
    }
  });
}

function renderLobby() {
  app.className = "screen";
  app.style.background = "#f2f2f5";
  app.innerHTML =
    '<div style="text-align:center">' +
      '<div style="font-size:56px;margin-bottom:20px">&#9989;</div>' +
      '<h2 style="color:#333;margin-bottom:8px">You\'re in, ' + pName + '!</h2>' +
      '<p style="color:#999;font-size:16px">Waiting for host to start...</p>' +
      '<div class="spinner"></div>' +
    '</div>';
}

function renderQuestion() {
  var q = QS[gameState.cq];
  app.className = "screen";
  app.style.background = "#1a1a2e";
  var elapsed = (Date.now() - gameState.st) / 1000;
  var t = Math.max(0, Math.ceil(TM - elapsed));

  var btnsHtml = "";
  for (var i = 0; i < q.o.length; i++) {
    btnsHtml += '<button class="answer-btn" style="background:' + CO[i] + '" data-idx="' + i + '"><span class="albl">' + LB[i] + '</span><span class="atxt">' + q.o[i] + '</span></button>';
  }

  app.innerHTML =
    '<div style="text-align:center;padding:16px 0;color:#fff;width:100%">' +
      '<div style="font-size:13px;color:#666;margin-bottom:4px">Q' + (gameState.cq+1) + '/' + QS.length + '</div>' +
      '<div style="font-size:36px;font-weight:900;color:#EC0002">' + q.a + '</div>' +
      '<div style="font-size:14px;color:#888;margin-top:4px">' + q.q + '</div>' +
      '<div id="p-timer" style="font-size:28px;font-weight:900;margin-top:10px;color:' + (t<=5?'#e74c3c':'#fff') + '">' + t + 's</div>' +
    '</div>' +
    '<div class="answer-grid">' + btnsHtml + '</div>';

  var buttons = app.querySelectorAll(".answer-btn");
  for (var b = 0; b < buttons.length; b++) {
    buttons[b].onclick = function() { submitAnswer(parseInt(this.getAttribute("data-idx"))); };
  }

  var timerEl = document.getElementById("p-timer");
  var tiv = setInterval(function() {
    var el2 = (Date.now() - gameState.st) / 1000;
    var t2 = Math.max(0, Math.ceil(TM - el2));
    if (timerEl) { timerEl.textContent = t2 + "s"; timerEl.style.color = t2 <= 5 ? "#e74c3c" : "#fff"; }
    if (t2 <= 0 || phase !== "question") clearInterval(tiv);
  }, 500);
}

function submitAnswer(i) {
  if (myAns !== null) return;
  myAns = i;
  phase = "answered";
  playersRef.child(pid).update({ans: i, fq: gameState.cq, at: Date.now()});
  renderAnswered();
}

function renderAnswered() {
  app.className = "screen";
  app.style.background = "#1a1a2e";
  app.innerHTML =
    '<div style="text-align:center;color:#fff;animation:pop 0.4s ease-out">' +
      '<div class="lock-circle" style="background:' + CO[myAns] + ';box-shadow:0 0 30px ' + CO[myAns] + '66">' + LB[myAns] + '</div>' +
      '<h2 style="color:#fff;margin-bottom:8px">Answer Locked! &#128274;</h2>' +
      '<p style="color:#666;font-size:14px">Waiting for reveal...</p>' +
    '</div>';
}

function renderReveal() {
  var q = QS[gameState.cq];
  app.className = "screen";
  app.style.background = wasCorrect ? "#0a3d1f" : "#3d0a0a";
  app.innerHTML =
    '<div style="text-align:center;color:#fff;animation:pop 0.4s ease-out">' +
      '<div style="font-size:72px;margin-bottom:16px">' + (wasCorrect ? '&#127881;' : '&#128556;') + '</div>' +
      '<h2 style="color:#fff;font-size:32px;margin-bottom:12px">' + (wasCorrect ? 'Correct!' : 'Wrong!') + '</h2>' +
      '<p style="font-size:16px;color:#ccc;margin-bottom:28px;padding:0 20px">' + q.o[q.c] + '</p>' +
      '<div class="score-box">' +
        '<div style="font-size:13px;color:#aaa;margin-bottom:4px">Your Score</div>' +
        '<div style="font-size:40px;font-weight:900">' + myScore + '</div>' +
      '</div>' +
    '</div>';
}

function renderLeaderboard() {
  app.className = "screen";
  app.style.background = "#f2f2f5";
  app.innerHTML =
    '<div style="text-align:center">' +
      '<h2 style="color:#EC0002;margin-bottom:20px">&#127942; Leaderboard</h2>' +
      '<div style="background:#fff;border-radius:20px;padding:28px 40px;box-shadow:0 4px 20px rgba(0,0,0,0.06)">' +
        '<div style="font-size:52px;font-weight:900;color:#333">' + myScore + '</div>' +
        '<div style="color:#999;font-size:14px">points</div>' +
      '</div>' +
      '<p style="color:#aaa;font-size:14px;margin-top:28px">Next question coming up...</p>' +
    '</div>';
}

function renderFinal() {
  app.className = "screen";
  app.style.background = "linear-gradient(135deg,#1a1a2e,#16213e)";
  app.innerHTML =
    '<div style="text-align:center;color:#fff;animation:pop 0.5s ease-out">' +
      '<div style="font-size:72px;margin-bottom:16px">&#127881;</div>' +
      '<h2 style="color:#fff;font-size:30px;margin-bottom:12px">Game Over!</h2>' +
      '<div class="score-box" style="margin-bottom:20px">' +
        '<div style="font-size:13px;color:#aaa;margin-bottom:4px">Final Score</div>' +
        '<div style="font-size:56px;font-weight:900;color:#EC0002">' + myScore + '</div>' +
      '</div>' +
      '<p style="color:#555;font-size:15px">Thanks for playing, ' + pName + '! &#128062;</p>' +
    '</div>';
}

renderJoin();
</script>
</body>
</html>
